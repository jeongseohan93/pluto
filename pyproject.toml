[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dev-orchestrator"
version = "0.4.0"
description = "Telemetry runner and slice pipeline for Claude Code: raw stream-json capture, tool/file accounting, context hotspot reports, unattended plan/implement/test loop in an isolated git worktree, and an epic decomposed into an approved queue of those slices."
readme = "README.md"
# 3.10, measured 2026-08-18 on macOS: aidev/verify.py calls
# Path.write_text(..., newline="\n"), and that argument only exists from 3.10.
# On 3.9 it is a TypeError at the moment verification writes its log.
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aidev = "aidev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aidev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
