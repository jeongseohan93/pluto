[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dev-orchestrator"
version = "0.2.0"
description = "Telemetry runner and slice pipeline for Claude Code: raw stream-json capture, tool/file accounting, context hotspot reports, unattended plan/implement/test loop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aidev = "aidev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aidev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
